<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="showcase-title">COLLECTION SHOWCASE</h2>
    <div class="category-filters">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="common">COMMON</button>
        <button class="filter-btn" data-filter="rare">RARE</button>
        <button class="filter-btn" data-filter="epic">EPIC</button>
        <button class="filter-btn" data-filter="legendary">LEGENDARY</button>
    </div>
    <div class="showcase-container">
        <div class="card-wrapper" data-category="common"><div class="card"><img src="card1.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="common"><div class="card"><img src="card2.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card"><img src="card3.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card"><img src="card4.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card"><img src="card5.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card"><img src="card6.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card"><img src="card7.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card"><img src="card8.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card"><img src="card9.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card"><img src="card10.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="legendary"><div class="card"><img src="card11.jpg" onerror="this.src='argus_card.jpg';"></div></div>
    </div>
    <script>
        const container = document.querySelector('.showcase-container');
        const wrappers = document.querySelectorAll('.card-wrapper');
        const btns = document.querySelectorAll('.filter-btn');

        function applyFilter(cat) {
            wrappers.forEach(w => w.classList.toggle('hidden', cat !== 'all' && w.dataset.category !== cat));
            const first = document.querySelector('.card-wrapper:not(.hidden)');
            if (first) first.scrollIntoView({ behavior: 'auto', inline: 'center' });
            setTimeout(updateCenter, 200);
        }

        function updateCenter() {
            const center = window.innerWidth / 2;
            let best = null, min = Infinity;
            document.querySelectorAll('.card-wrapper:not(.hidden)').forEach(w => {
                const dist = Math.abs(center - (w.getBoundingClientRect().left + w.offsetWidth/2));
                if (dist < min) { min = dist; best = w; }
            });
            wrappers.forEach(w => w.classList.remove('active'));
            if (best) {
                best.classList.add('active');
                // ล็อคกลางจอเฉพาะ Desktop
                if (window.innerWidth > 768) {
                    best.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }
        }

        btns.forEach(b => b.addEventListener('click', () => {
            btns.forEach(btn => btn.classList.remove('active'));
            b.classList.add('active');
            applyFilter(b.dataset.filter);
        }));

        let scrollTimeout;
        container.addEventListener('scroll', () => {
            updateCenter();
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(updateCenter, 150);
        });
        window.addEventListener('resize', updateCenter);
        applyFilter('all');
    </script>
</body>
</html>

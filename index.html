<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Showcase</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="showcase-title" data-tilt data-tilt-max="15" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.3">COLLECTION SHOWCASE</h2>

    <!-- ระบบปุ่มกรองหมวดหมู่ -->
    <div class="category-filters">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn common-btn" data-filter="common">COMMON</button>
        <button class="filter-btn rare-btn" data-filter="rare">RARE</button>
        <button class="filter-btn epic-btn" data-filter="epic">EPIC</button>
        <button class="filter-btn legendary-btn" data-filter="legendary">LEGENDARY</button>
    </div>

    <div class="showcase-container">
        <!-- ใส่ data-category เพื่อแยกหมวดหมู่ให้การ์ดแต่ละใบ -->
        <div class="card-wrapper" data-category="common"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card1.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card1_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="common"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card2.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card2_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>

        <div class="card-wrapper" data-category="rare"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card3.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card3_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card4.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card4_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card5.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card5_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card6.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card6_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>

        <div class="card-wrapper" data-category="epic"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card7.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card7_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card8.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card8_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card9.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card9_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card10.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card10_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>

        <div class="card-wrapper" data-category="legendary"><div class="card-inner" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><div class="card-front"><img src="card11.jpg" onerror="this.src='argus_card.jpg';"></div><div class="card-back"><img src="card11_back.jpg" onerror="this.src='argus_card.jpg';"></div></div></div>
    </div>
    <!-- ปุ่มเพลงและ Audio (มีแค่ชุดเดียว) -->
    <button id="musicBtn" class="music-btn">🎵</button>
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script>
        VanillaTilt.init(document.querySelectorAll(".card"), { max: 20, speed: 400, perspective: 1000 });

        // 2. Music Logic
        const music = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        music.volume = 0.1;

        function tryPlay() {
            music.play().then(() => {
                document.body.removeEventListener('click', tryPlay);
                musicBtn.textContent = "🎵";
            }).catch(e => console.log("รอการโต้ตอบ"));
        }
        document.body.addEventListener('click', tryPlay, { once: true });

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // ป้องกันไม่ให้ Event กระจายไปตัวอื่น
            if (music.paused) {
                music.play();
                musicBtn.textContent = "🎵";
            } else {
                music.pause();
                musicBtn.textContent = "🔇";
            }
        });

        // 3. Showcase & Filter Logic
        const container = document.querySelector('.showcase-container');
        const wrappers = document.querySelectorAll('.card-wrapper');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // ฟังก์ชันกรองการ์ดตามหมวดหมู่
        function applyFilter(category) {
            let visibleWrappers = [];
            wrappers.forEach(wrapper => {
                wrapper.classList.remove('first-visible', 'last-visible'); // เคลียร์คลาสระยะห่าง

                if (category === 'all' || wrapper.getAttribute('data-category') === category) {
                    wrapper.classList.remove('hidden');
                    visibleWrappers.push(wrapper);
                } else {
                    wrapper.classList.add('hidden');
                }
            });

            // กำหนดใบแรกและใบสุดท้ายของหมวดนั้นๆ ให้มีระยะดันตรงกลาง
            if (visibleWrappers.length > 0) {
                visibleWrappers[0].classList.add('first-visible');
                visibleWrappers[visibleWrappers.length - 1].classList.add('last-visible');
            }

            // เลื่อนกลับไปจุดเริ่มต้นเมื่อเปลี่ยนหมวดหมู่
            container.scrollTo({ left: 0, behavior: 'smooth' });
            setTimeout(updateCenterCard, 200);
        }

        // กดปุ่มเพื่อเปลี่ยนหมวดหมู่
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyFilter(btn.getAttribute('data-filter'));
            });
        });

        // จัดการเลื่อนเมาส์
        container.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                container.scrollBy({ left: e.deltaY * 2, behavior: 'auto' });
            }
        });

        // จัดการคลิกการ์ด
        wrappers.forEach(wrapper => {
            wrapper.addEventListener('click', () => {
                wrapper.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            });
        });

        // ตรวจสอบใบที่อยู่ตรงกลาง (นับเฉพาะใบที่แสดงผลอยู่)
function updateCenterCard() {
            const centerPoint = window.innerWidth / 2;
            let minDistance = Infinity;
            let centerWrapper = null;
            document.querySelectorAll('.card-wrapper:not(.hidden)').forEach(wrapper => {
                const rect = wrapper.getBoundingClientRect();
                const wrapperCenter = rect.left + (rect.width / 2);
                const distance = Math.abs(centerPoint - wrapperCenter);
                if (distance < minDistance) { minDistance = distance; centerWrapper = wrapper; }
            });
            wrappers.forEach(w => w.classList.remove('active'));
            if (centerWrapper) centerWrapper.classList.add('active');
        }

        container.addEventListener('scroll', updateCenterCard);
        window.addEventListener('resize', updateCenterCard);

        applyFilter('all');
    </script>
</body>
</html>

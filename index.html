<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Showcase</title>
    <meta name="google" content="notranslate">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="showcase-title" data-tilt data-tilt-max="15" data-tilt-speed="400">COLLECTION SHOWCASE</h2>
    <div class="category-filters">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="common">COMMON</button>
        <button class="filter-btn" data-filter="rare">RARE</button>
        <button class="filter-btn" data-filter="epic">EPIC</button>
        <button class="filter-btn" data-filter="legendary">LEGENDARY</button>
    </div>
    <div class="showcase-container">
        <div class="card-wrapper" data-category="common"><div class="card" data-tilt><img src="card1.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="common"><div class="card" data-tilt><img src="card2.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt><img src="card3.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt><img src="card4.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt><img src="card5.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt><img src="card6.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt><img src="card7.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt><img src="card8.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt><img src="card9.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt><img src="card10.jpg" onerror="this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="legendary"><div class="card" data-tilt><img src="card11.jpg" onerror="this.src='argus_card.jpg';"></div></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script>
        VanillaTilt.init(document.querySelectorAll(".card"), { max: 20, speed: 400, perspective: 1000, glare: false });
        const container = document.querySelector('.showcase-container');
        const wrappers = document.querySelectorAll('.card-wrapper');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function applyFilter(category) {
            wrappers.forEach(w => {
                if (category === 'all' || w.getAttribute('data-category') === category) w.classList.remove('hidden');
                else w.classList.add('hidden');
            });
            // ใช้ 'auto' เพื่อวาร์ปไปใบแรกทันที ไม่ให้มีจังหวะเลื่อนหน่วงมาขัดระบบ Snap
            const first = document.querySelector('.card-wrapper:not(.hidden)');
            if (first) first.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
            setTimeout(updateCenterCard, 100);
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyFilter(btn.getAttribute('data-filter'));
            });
        });

        function updateCenterCard() {
            const center = window.innerWidth / 2;
            let best = null, min = Infinity;
            document.querySelectorAll('.card-wrapper:not(.hidden)').forEach(w => {
                const dist = Math.abs(center - (w.getBoundingClientRect().left + w.offsetWidth/2));
                if (dist < min) { min = dist; best = w; }
            });
            wrappers.forEach(w => w.classList.remove('active'));
            if (best) best.classList.add('active');
        }

        container.addEventListener('scroll', updateCenterCard);
        window.addEventListener('resize', updateCenterCard);
        applyFilter('all');
    </script>
</body>
</html>

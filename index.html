        <button id="musicBtn" class="music-btn">🎵</button>
        <audio id="bgMusic">
            <source src="music.mp3" type="audio/mpeg">
        </audio>
        <button id="nextMusicBtn" class="music-btn" style="left: 80px;">⏭️</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script>
        VanillaTilt.init(document.querySelectorAll(".card"), { max: 20, speed: 400, perspective: 1000 });
        VanillaTilt.init(document.querySelector(".showcase-title"));

        const container = document.querySelector('.showcase-container');
        const wrappers = document.querySelectorAll('.card-wrapper');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // ฟังก์ชันกรองการ์ดตามหมวดหมู่
        function applyFilter(category) {
            let visibleWrappers = [];
            wrappers.forEach(wrapper => {
                wrapper.classList.remove('first-visible', 'last-visible'); // เคลียร์คลาสระยะห่าง
                
                if (category === 'all' || wrapper.getAttribute('data-category') === category) {
                    wrapper.classList.remove('hidden');
                    visibleWrappers.push(wrapper);
                } else {
                    wrapper.classList.add('hidden');
                }
            });

            // กำหนดใบแรกและใบสุดท้ายของหมวดนั้นๆ ให้มีระยะดันตรงกลาง
            if (visibleWrappers.length > 0) {
                visibleWrappers[0].classList.add('first-visible');
                visibleWrappers[visibleWrappers.length - 1].classList.add('last-visible');
            }

            // เลื่อนกลับไปจุดเริ่มต้นเมื่อเปลี่ยนหมวดหมู่
            container.scrollTo({ left: 0, behavior: 'smooth' });
            setTimeout(updateCenterCard, 300);
        }

        // กดปุ่มเพื่อเปลี่ยนหมวดหมู่
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyFilter(btn.getAttribute('data-filter'));
            });
        });

        // จัดการเลื่อนเมาส์
        container.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                container.scrollBy({ left: e.deltaY * 2, behavior: 'auto' });
            }
        });

        wrappers.forEach(wrapper => {
            wrapper.addEventListener('click', () => {
                wrapper.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            });
        });

        // ตรวจสอบใบที่อยู่ตรงกลาง (นับเฉพาะใบที่แสดงผลอยู่)
        function updateCenterCard() {
            const centerPoint = window.innerWidth / 2;
            let minDistance = Infinity;
            let centerWrapper = null;
            
            const visibleWrappers = document.querySelectorAll('.card-wrapper:not(.hidden)');

            visibleWrappers.forEach(wrapper => {
                const rect = wrapper.getBoundingClientRect();
                const wrapperCenter = rect.left + (rect.width / 2);
                const distance = Math.abs(centerPoint - wrapperCenter);

                if (distance < minDistance) {
                    minDistance = distance;
                    centerWrapper = wrapper;
                }
            });

            wrappers.forEach(w => w.classList.remove('active'));
            if (centerWrapper) {
                centerWrapper.classList.add('active');
            }
        }

        container.addEventListener('scroll', updateCenterCard);
        window.addEventListener('resize', updateCenterCard);
        
        // --- ส่วนที่เพิ่มใหม่: Flip Logic ---
        function flipCard(btn) {
            const wrapper = btn.closest('.card-wrapper');
            wrapper.classList.toggle('flipped');
        }

        // --- ส่วนที่เพิ่มใหม่: Music Logic ---
        const music = document.getElementById("bgMusic");
        const playlist = ["music.mp3", "music2.mp3", "music3.mp3", "music4.mp3", "music5.mp3", "music6.mp3"]; // ใส่ชื่อไฟล์เพลงที่สองที่นี่
        const musicBtn = document.getElementById("musicBtn");
        let currentTrack = 0; // เพลงที่เล่นอยู่ปัจจุบัน
        music.volume = 0.1;
        
        function nextTrack() {
            currentTrack = (currentTrack + 1) % playlist.length; // สลับ index วนลูป
            music.src = playlist[currentTrack]; // เปลี่ยน source ไฟล์เพลง
            music.play();
        }
        // ผูกฟังก์ชัน nextTrack ให้ทำงานอัตโนมัติเมื่อเพลงจบ
            music.addEventListener('ended', nextTrack);
        // ป้องกันปัญหา Auto-play block ของ Browser
        function tryPlay() {
            music.play().then(() => {
                document.body.removeEventListener('click', tryPlay);
            }).catch(e => console.log("รอการโต้ตอบ"));
        }
        document.body.addEventListener('click', tryPlay, { once: true });

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (music.paused) { 
                music.play(); 
                musicBtn.textContent = "🎵"; 
            } else { 
                music.pause(); 
                musicBtn.textContent = "🔇"; 
            }
        });
        document.getElementById("nextMusicBtn").addEventListener('click', (e) => {
            e.stopPropagation();
            nextTrack();
        });
        // รันครั้งแรกเมื่อเปิดเว็บ
        applyFilter('all');
    </script>

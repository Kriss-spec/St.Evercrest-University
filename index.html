<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Showcase</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="showcase-title" data-tilt data-tilt-max="15" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.3">COLLECTION SHOWCASE</h2>

    <div class="category-filters">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn common-btn" data-filter="common">COMMON</button>
        <button class="filter-btn rare-btn" data-filter="rare">RARE</button>
        <button class="filter-btn epic-btn" data-filter="epic">EPIC</button>
        <button class="filter-btn legendary-btn" data-filter="legendary">LEGENDARY</button>
    </div>

    <div class="showcase-container">
        <div class="card-wrapper" data-category="common"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card1.jpg" alt="Card 1" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="common"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card2.jpg" alt="Card 2" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card3.jpg" alt="Card 3" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card4.jpg" alt="Card 4" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card5.jpg" alt="Card 5" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="rare"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card6.jpg" alt="Card 6" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card7.jpg" alt="Card 7" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>        
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card8.jpg" alt="Card 8" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card9.jpg" alt="Card 9" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="epic"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card10.jpg" alt="Card 10" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
        <div class="card-wrapper" data-category="legendary"><div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.5"><img src="card11.jpg" alt="Card 11" onerror="this.onerror=null; this.src='argus_card.jpg';"></div></div>
    </div>

    <!-- ปุ่มเปิด/ปิดเพลง -->
    <button id="musicBtn" class="music-btn">🎵</button>
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script>
        VanillaTilt.init(document.querySelectorAll(".card"), { max: 20, speed: 400, perspective: 1000 });
        VanillaTilt.init(document.querySelector(".showcase-title"));

        const container = document.querySelector('.showcase-container');
        const wrappers = document.querySelectorAll('.card-wrapper');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // ฟังก์ชันระบบเพลง
        const music = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        document.body.addEventListener('click', () => {
            if (music.paused) music.play().catch(e => console.log("รอการคลิก"));
        }, { once: true });
        musicBtn.addEventListener('click', () => {
            if (music.paused) { music.play(); musicBtn.textContent = "🎵"; }
            else { music.pause(); musicBtn.textContent = "🔇"; }
        });

        function applyFilter(category) {
            wrappers.forEach(wrapper => {
                wrapper.classList.remove('first-visible', 'last-visible');
                if (category === 'all' || wrapper.getAttribute('data-category') === category) {
                    wrapper.classList.remove('hidden');
                } else { wrapper.classList.add('hidden'); }
            });
            updateCenterCard();
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyFilter(btn.getAttribute('data-filter'));
            });
        });

        function updateCenterCard() {
            const centerPoint = window.innerWidth / 2;
            let minDistance = Infinity, centerWrapper = null;
            document.querySelectorAll('.card-wrapper:not(.hidden)').forEach(wrapper => {
                const rect = wrapper.getBoundingClientRect();
                const dist = Math.abs(centerPoint - (rect.left + rect.width / 2));
                if (dist < minDistance) { minDistance = dist; centerWrapper = wrapper; }
            });
            wrappers.forEach(w => w.classList.remove('active'));
            if (centerWrapper) centerWrapper.classList.add('active');
        }

        container.addEventListener('scroll', updateCenterCard);
        window.addEventListener('resize', updateCenterCard);
        applyFilter('all');
    </script>
</body>
</html>
